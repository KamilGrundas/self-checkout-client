[package]
name = "self-checkout-client"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
iced = { version = "0.14.0", features = ["image"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
